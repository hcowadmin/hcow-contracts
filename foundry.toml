# Foundry sits alongside the existing in-process EVM harness. compile.cjs still
# produces the artifacts that test.cjs and audit.cjs use, and this is here for
# the one thing those cannot do: let a machine search the state space instead
# of replaying sequences their author thought of.
[profile.default]
src = "contracts"
test = "foundry"
out = "foundry-out"
cache_path = "foundry-cache"
libs = ["node_modules", "foundry/lib"]
solc = "/usr/local/bin/solc"   # 0.8.34, the pinned version
# evm_version is pinned to "paris" DELIBERATELY and must match
# hardhat.config.cjs, the other repository's foundry.toml and compile.cjs
# exactly. The compiler settings are part of the BscScan verification input, so
# a mismatch produces different bytecode and a verification failure with no
# useful error. paris rather than shanghai or cancun is a portability choice
# rather than a capability one: BNB Chain supports PUSH0, transient storage and
# MCOPY, nothing here uses them, and paris keeps the deployed bytecode free of
# any opcode a fork, an archive node or an auditor's tooling might not
# implement. See hardhat.config.cjs for the full rationale.
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/=node_modules/@openzeppelin/", "forge-std/=foundry/lib/forge-std/src/"]

[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = false
shrink_run_limit = 5000

[profile.deep.invariant]
runs = 2000
depth = 400
fail_on_revert = false
shrink_run_limit = 20000
